<section class="welcome-card">
  <h1>Welcome to CarCare</h1>
  <p>
    Track your vehicles, expenses, maintenance, and reminders in one place.
  </p>

  <p class="status">
    API:
    @if (apiAvailable() === undefined) {
      <span>checking...</span>
    } @else if (apiAvailable()) {
      <span class="ok">available</span>
    } @else {
      <span class="error">unavailable</span>
    }
  </p>
</section>
